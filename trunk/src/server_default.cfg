//
// Rotu 2.2.2-git server.cfg
//

//******************************************************************************
// COLOR CODES
//******************************************************************************

  //**** 
  //****   Colors for text. Useful for your server name, motd messages.
  //**** 
  //****   ^1 = Red      ^2 = Green    ^3 = Yellow   ^4 = Blue
  //****   ^5 = Cyan     ^6 = Pink     ^7 = White    ^8 = Grey
  //****   ^9 = Maroon   ^0 = Black


//******************************************************************************
// SERVER INFORMATION
//******************************************************************************

  //**** Info
sets sv_hostname                  "^3My ^1ROTU 2.2.2-git ^2Zombies"

  //**** 
  //**** Does not grant any admin authority--see admin.cfg for that
  //**** 
set _Admin                        "^1My Admin"
set _Website                      "example.com"
set _Location                     "USA"
set _Mod                          "Reign of the Undead 2.2.2-git"
set _ModVer                       "2.2.2"


//******************************************************************************
// NETWORK OPTIONS
//******************************************************************************

  //**** 
  //**** Network options. If these are set in the command line, they are not needed here,
  //**** but if used, they must match the command line
  //****
set net_ip                        "192.168.1.11"        // Set your server IP address
set net_port                      "28960"               // Set your port number

  //**** 
  //**** Server type
  //**** 0 - Listen server, used with playMod.[bat|ps1|sh]
  //**** 1 - LAN server, used with host.[bat|ps1|sh]
  //**** 2 - Internet server, used with host.[bat|ps1|sh], or for a server hosting provider
  //****
set dedicated                     0

  //****
  //**** Server Provider
  //**** A semi-colon separated list of the server providers. They will show up in the
  //**** end-game credits in the order listed. Carat color codes are acceptable
  //**** Ex: "John Q. Public;Jane Doe;John Smith"
  //****
set server_provider               "^6My Server Provider"

  //****
  //**** Server Customizer
  //**** A semi-colon separated list of people to credit for helping you customize your
  //**** server, such as code changes, skins, etc. They will show up in the end-game
  //**** credits in the order listed. Carat color codes are acceptable
  //**** Ex: "John Q. Public;Jane Doe;John Smith"
  //****
set server_customizer             ""

  //****
  //**** A clan-specific message to display on the main menu. The text will be centered
  //**** within its box, and the text will auto-wrap. Caret color codes may be used,
  //**** however, they will not wrap, i.e. if the text is blue at the end of one autowrapped
  //**** line, the text will revert to white at the beginning of the next line. You have
  //**** about 150 characters to work with, not counting caret color codes.
  //****
set server_main_menu_clan_text    "^4Thanks^1 for playing on my server!"


//******************************************************************************
// PASSWORDS
//******************************************************************************

set rcon_password                 ""            // Rcon pass. Must be set!
set rcon_password_backup          ""            // Backup copy of rcon password (Required!)
set sv_privatePassword            ""            // Private password, to access private slots
set g_password                    ""            // Game password. If set, players cannot join without this password

//******************************************************************************
// BOT NAMES SETUP - ***COD4X ONLY***
//******************************************************************************

set bot_use_clan_name             1             // Use a fake clan tag in the bot names? [0|1]
set bot_name_order                "random"      // Pick names in random order, or in sequential order? [random|sequential]
set bot_nameset                   "punny"       // [elements|presidents|protagonists|punny], or a complete comma-separated list of bot names

//******************************************************************************
// PLAYER SLOTS SETUP
//******************************************************************************

set sv_maxclients                 "40"          // MAX server player slots, this is TOTAL player slots
set ui_maxclients                 "40"          // Same as max slots
set sv_privateclients             ""            // Number of private player slots, maxclients - privateclients = public slots
set bot_count                     25            // Initial bot count. Total human players is sv_maxclients - bot_count


  //****
  //**** Flexible Slot System
  //**** Between each wave, the number of bots is adjusted to make maximum use of server
  //**** slots. Part of the new AI under development, which absolutely should not be used yet.
  //****
set use_flexible_slots            1             // use the FSS? [0|1] for false, true
set max_bots                      35            // Never have more bots than this
set max_players                   20            // Never have more human players than this
set min_open_player_slots         3             // Always try to leave this many slots open for players to join the game
set slot_tolerance                2             // Do not modify slots if current setup is +/- this value of the goal


//******************************************************************************
// VOICE
//******************************************************************************

set sv_voice                      "0"
set sv_voiceQuality               "9"
set voice_deadChat                "1"
set voice_global                  "1"
set voice_localEcho               "0"
set winvoice_mic_mute             "1"


//******************************************************************************
// DOWNLOAD
//******************************************************************************

set sv_allowDownload              "1"
set sv_wwwDownload                "1"
set sv_wwwDlDisconnected          "0"

  //****
  //**** URL to an http server for fast downloads, if you have one. If not, downloads
  //**** will be limited to about 12 Kib/s.
  //****
set sv_wwwBaseURL                 ""


//******************************************************************************
// PING & CONNECTION
//******************************************************************************

set sv_minPing                    "0"           // MIN player ping on CONNECT, any lower and player isnt allowed to connect
set sv_maxping                    "350"         // MAX player ping on CONNECT, any higher and player isnt allowed to connect
set net_noipx                     "1"           // Allow ONLY tcp/ip protocol, player/server communications
set g_antilag                     "1"


//******************************************************************************
// ANTI-FLOOD SETTINGS
//******************************************************************************

set sv_floodProtect               "1"
set sv_reconnectlimit             "3"
set g_no_script_spam              "1"


//******************************************************************************
// ANTI-CHEAT SETTINGS
//******************************************************************************

set sv_disableClientConsole       "1"
set cl_autocmd                    "0"
set sv_pure                       "1"
set g_banIPs                      ""
set sv_punkbuster                 "0"


//******************************************************************************
// LOG SETTINGS
//******************************************************************************

  //****
  //**** The cod4 main logfile is console_mp.log. It logs game initialization, dvars,
  //**** and runtime errors. g_log logs chat, join/quit messages, errors, notices, and
  //**** debug info (when enabled)
  //****
set g_log                         "server_mp.log"
set g_logsync                     2             // write to logfile immediately, without buffering. Required by B3
set logfile                       1
set sv_log_damage                 1
set sv_hide_log_message           "trace, debug, value, signal, pre" // hide these type of messages


//******************************************************************************
// VOTING
//******************************************************************************

  //****
  //**** Allow in-game voting? Has no effect of end-game map voting.
  //****
set g_allowVote                   "0"


//******************************************************************************
// RATE LIMITS
//******************************************************************************

set sv_maxRate                    "25000"
set sv_maxRate                    25000


//******************************************************************************
// ADDITIONAL CONFIGURATION FILES
//******************************************************************************

  //****
  //**** Parse main game setting dvars in game.cfg
  //****
exec game.cfg

  //****
  //**** Parse weapon damage and distance dvars in damage.cfg
  //****
exec damage.cfg

  //****
  //**** Parse the in-game 'Did You Know' messages
  //****
exec didyouknow.cfg

  //****
  //**** Parse the administrator and warnings system dvars
  //****
exec admin.cfg

  //****
  //**** Parse the map voting dvars in mapvote.cfg
  //****
exec mapvote.cfg

  //****
  //**** Parse the weapons dvars in weapons.cfg
  //****
exec weapons.cfg

  //****
  //**** The settings in easy.cfg are all specified elsewhere, but override those settings
  //**** if this line is uncommented. easy.cfg is just a convenient collection of settings
  //**** that can make the game much easier, with default settings for an 'easy' version
  //**** of the game. This must remain the last config file executed for it to work properly!
  //****
//exec easy.cfg
