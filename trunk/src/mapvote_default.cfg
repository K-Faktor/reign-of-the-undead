//******************************************************************************
// MAP NAMES
//******************************************************************************

  //****
  //**** We set an english name for *ALL* maps here, regardless of what maps you
  //**** have or run on your server. This string-packing saves many dvars (which
  //**** are limited! Running out may crash maps, or even the server).
  //****
  //**** You can override our name by using the prior syntax:
  //****    set name_mp_bloc "My Custom Name"
  //**** You do not have to edit our packed-string to change our names.
  //****
  //**** I am open to hosting master.map.names.json files for other languages, if
  //**** people want translated names. Open a bug report on github.
  //****
  //**** Packed string version. You can grab the latest list from git at any time.
  //**** Format is [mapname without 'mp_']:English name of map,
  //****

