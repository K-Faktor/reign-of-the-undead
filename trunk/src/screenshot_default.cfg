// This file requires no configuration. It is a better alternative for the stock minimap.cfg
// file for taking screenshots, in that it doesn't restrict vertical range of freelook.
// incant `/exec screenshot` instead of `/exec minimap`

cg_draw2D 0
cg_drawGun 0
cg_drawCrosshair 0
cg_hudChatPosition "0 0"     // hides chat if you want
r_fog 0
fx_enable 0                  // optional
r_znear 16                   // optional, removes near clipping